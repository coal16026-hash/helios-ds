<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Log in to Helios</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--raise:#f4f4f4;--hov:rgba(0,0,0,.05);--bd:rgba(0,0,0,.14);--tx:#0d0d0d;--mu:#6b6b6b;--btn:#0d0d0d;--btnt:#fff;--err:#c8321f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f0f10;--raise:#161618;--hov:rgba(255,255,255,.06);--bd:rgba(255,255,255,.14);--tx:#e4e4e6;--mu:#84848a;--btn:#f2f2f3;--btnt:#0b0b0c;--err:#ff7b68}}
:root[data-theme=dark]{--bg:#0f0f10;--raise:#161618;--hov:rgba(255,255,255,.06);--bd:rgba(255,255,255,.14);--tx:#e4e4e6;--mu:#84848a;--btn:#f2f2f3;--btnt:#0b0b0c;--err:#ff7b68}
:root[data-theme=light]{--bg:#fff;--raise:#f4f4f4;--hov:rgba(0,0,0,.05);--bd:rgba(0,0,0,.14);--tx:#0d0d0d;--mu:#6b6b6b;--btn:#0d0d0d;--btnt:#fff;--err:#c8321f}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg)}
body{font:400 15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.card{width:100%;max-width:400px;text-align:center}
.logo{display:inline-flex;margin-bottom:28px;animation:sunin .9s cubic-bezier(.22,1,.36,1)}
@keyframes sunin{from{transform:rotate(-70deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
h1{font-size:28px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--mu);margin-top:8px;min-height:22px}
form{margin-top:28px;text-align:left;display:grid;gap:12px}
.f{position:relative}
.f input{width:100%;height:54px;padding:20px 20px 6px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:999px;outline:0;transition:border-color .12s,box-shadow .12s}
.f.pw input{padding-right:56px}
.f label{position:absolute;left:21px;top:16px;color:var(--mu);pointer-events:none;transition:all .12s;transform-origin:left}
.f input:focus+label,.f input:not(:placeholder-shown)+label{top:7px;font-size:12px}
.f input:focus{border-color:var(--tx);box-shadow:0 0 0 1px var(--tx)}
.f.bad input{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.f.bad input:focus+label,.f.bad label{color:var(--err)}
.eye{position:absolute;right:8px;top:9px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mu);background:none;border:0;cursor:pointer}
.eye:hover{background:var(--hov)}
.msg{color:var(--err);font-size:13px;padding:0 20px;margin-top:-4px;min-height:0}
.msg:empty{display:none}
.primary{height:54px;border:0;border-radius:999px;background:var(--btn);color:var(--btnt);font:500 15px Inter,system-ui,sans-serif;cursor:pointer;transition:opacity .12s;margin-top:4px}
.primary:hover{opacity:.88}.primary:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.switch{margin-top:22px;color:var(--mu);text-align:center}
.switch a,.switch button{color:var(--tx);font:inherit;background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.chip{display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px;padding:0 8px 0 20px;border:1px solid var(--bd);border-radius:999px;background:var(--raise)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{font:500 13px Inter,sans-serif;color:var(--tx);background:none;border:0;cursor:pointer;padding:8px 12px;border-radius:999px}
.chip button:hover{background:var(--hov)}
.or{display:flex;align-items:center;gap:16px;margin:24px 0 20px;color:var(--mu);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}
.soc{display:grid;gap:10px}
.soc button{height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--tx);font:500 15px Inter,sans-serif;cursor:pointer;transition:background-color .1s}
.soc button:hover{background:var(--hov)}
.soc svg{width:20px;height:20px}
.soc span{flex:1;text-align:center;margin-right:20px}
.note{color:var(--mu);font-size:13px;text-align:center;margin-top:14px;min-height:20px}
.reset-warn{display:block;margin-bottom:8px;color:var(--mu)}
.reset-link{display:inline-block;padding:9px 18px;border-radius:999px;background:var(--btn);color:var(--btnt);font-size:14px;font-weight:500;text-decoration:none}
.reset-link:hover{opacity:.88}
footer{padding:16px 24px 24px;text-align:center;font-size:13px;color:var(--mu)}
footer a{color:var(--mu);text-decoration:underline;text-underline-offset:3px}footer a:hover{color:var(--tx)}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){.logo{animation:none}.f input,.f label{transition:none}}
</style></head>
<body>
<main><div class="card">
<span class="logo" id="logo"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="currentColor" stroke-width=".7" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5" stroke="none"/><path d="M11.05 6.00L12 0.50L12.95 6.00Z" transform="rotate(0 12 12)"/><path d="M11.05 6.00L12 3.10L12.95 6.00Z" transform="rotate(30 12 12)"/><path d="M11.05 6.00L12 0.50L12.95 6.00Z" transform="rotate(60 12 12)"/><path d="M11.05 6.00L12 3.10L12.95 6.00Z" transform="rotate(90 12 12)"/><path d="M11.05 6.00L12 0.50L12.95 6.00Z" transform="rotate(120 12 12)"/><path d="M11.05 6.00L12 3.10L12.95 6.00Z" transform="rotate(150 12 12)"/><path d="M11.05 6.00L12 0.50L12.95 6.00Z" transform="rotate(180 12 12)"/><path d="M11.05 6.00L12 3.10L12.95 6.00Z" transform="rotate(210 12 12)"/><path d="M11.05 6.00L12 0.50L12.95 6.00Z" transform="rotate(240 12 12)"/><path d="M11.05 6.00L12 3.10L12.95 6.00Z" transform="rotate(270 12 12)"/><path d="M11.05 6.00L12 0.50L12.95 6.00Z" transform="rotate(300 12 12)"/><path d="M11.05 6.00L12 3.10L12.95 6.00Z" transform="rotate(330 12 12)"/></g></svg></span>
<h1 id="h1">Welcome back</h1>
<p class="sub" id="sub">Log in to continue to Helios.</p>

<form id="form" novalidate autocomplete="on">
 <div id="chipWrap" class="chip" hidden><span id="chipEmail"></span><button type="button" id="edit">Edit</button></div>
 <div class="f" id="fEmail"><input id="email" type="email" name="email" placeholder=" " autocomplete="email" required><label for="email">Email address</label></div>
 <div class="f" id="fName" hidden><input id="name" type="text" name="name" placeholder=" " autocomplete="name"><label for="name">Full name</label></div>
 <div class="f pw" id="fPw" hidden><input id="pw" type="password" name="password" placeholder=" " autocomplete="current-password"><label for="pw">Password</label>
  <button type="button" class="eye" id="eye" aria-label="Show password"></button></div>
 <div class="msg" id="msg" role="alert" aria-live="polite"></div>
 <button class="primary" id="go" type="submit">Continue</button>
</form>

<p class="switch" id="forgotWrap" hidden><button type="button" id="fp">Forgot password?</button></p>
<p class="switch" id="switch">Don’t have an account? <button type="button" id="flip">Sign up</button></p>

<div class="or">or</div>
<div class="soc">
 
 <button type="button" data-p="GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.500 11.500 0 0 0-3.640 22.410c.580.110.790-.250.790-.560v-2c-3.200.700-3.880-1.360-3.880-1.360-.520-1.330-1.280-1.690-1.280-1.690-1.040-.710.080-.700.080-.700 1.150.080 1.760 1.180 1.760 1.180 1.030 1.760 2.700 1.250 3.360.960.100-.750.400-1.250.730-1.540-2.550-.290-5.240-1.280-5.240-5.690 0-1.260.450-2.280 1.180-3.090-.120-.290-.510-1.460.110-3.040 0 0 .970-.310 3.170 1.180a11 11 0 0 1 5.770 0c2.200-1.490 3.170-1.180 3.170-1.180.630 1.580.230 2.750.110 3.040.740.810 1.180 1.830 1.180 3.090 0 4.420-2.690 5.390-5.260 5.670.410.360.780 1.060.780 2.140v3.170c0 .310.210.680.800.560A11.500 11.500 0 0 0 12 .5z"/></svg><span>Continue with GitHub</span></button>
 <button type="button" data-p="Discord"><svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.300 4.400A19.500 19.500 0 0 0 15.500 3l-.230.450a18 18 0 0 0-5.400 0L9.600 3a19.500 19.500 0 0 0-4.800 1.400C1.800 8.900 1 13.300 1.400 17.600a19.700 19.700 0 0 0 6 3l1.200-2a12.500 12.500 0 0 1-1.900-.9l.470-.360a14 14 0 0 0 12.100 0l.470.360c-.600.360-1.200.660-1.900.900l1.200 2a19.700 19.700 0 0 0 6-3c.500-5-.8-9.300-3.300-13.200zM8.700 15c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400S9.900 15 8.700 15zm6.600 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400S16.500 15 15.300 15z"/></svg><span>Continue with Discord</span></button>
</div>
<p class="note" id="note" role="status"></p>
</div></main>

<script>
const APP_URL='/app'; // where to go after signing in
const $=s=>document.querySelector(s);
const eyeOn='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const eyeOff='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.600 6.100A10 10 0 0 1 12 5c6.500 0 10 7 10 7a17 17 0 0 1-3.200 4.100M6.600 6.600A17 17 0 0 0 2 12s3.500 7 10 7c1.800 0 3.400-.5 4.800-1.200M9.900 9.900a3 3 0 0 0 4.200 4.200"/></svg>';
$('#eye').innerHTML=eyeOn;

let mode='login',step=1,busy=false,resetToken='';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{if(v===null||v===undefined)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}};

// Match the app's saved theme so both screens look identical.
(function(){const t=ls.get('ht')||'system';if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t})();

const api=async(action,payload)=>{
 const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action},payload))});
 let j={};try{j=await r.json()}catch(e){}
 return j;
};

function bad(id,text){document.querySelectorAll('.f').forEach(f=>f.classList.remove('bad'));if(id)$('#'+id).classList.add('bad');$('#msg').textContent=text||''}

function render(){
 const login=mode==='login',reset=mode==='reset';
 $('#h1').textContent=reset?(step===1?'Reset password':'Choose a new password'):(step===1?(login?'Welcome back':'Create your account'):(login?'Enter your password':'Finish creating your account'));
 $('#sub').textContent=reset?(step===1?'Enter your email and we will send you a reset link.':''):(step===1?(login?'Log in to continue to Helios.':'Start using Helios in a minute.'):'');
 document.title=reset?'Reset password | Helios':(login?'Log in':'Sign up')+' | Helios';
 $('#chipWrap').hidden=step===1;$('#chipEmail').textContent=$('#email').value.trim();
 $('#fEmail').hidden=step===2;
 $('#fName').hidden=!(step===2&&!login&&!reset);
 $('#fPw').hidden=step===1;
 $('#fPw').querySelector('label').textContent=reset?'New password':'Password';
 $('#pw').autocomplete=reset?'new-password':(login?'current-password':'new-password');
 $('#go').textContent=reset?(step===1?'Send reset link':'Reset password'):(step===1?'Continue':(login?'Log in':'Create account'));
 $('#forgotWrap').hidden=!(login&&step===2&&!reset);
 $('#switch').hidden=reset;
 $('#switch').innerHTML=login?'Don’t have an account? <button type="button" id="flip">Sign up</button>':'Already have an account? <button type="button" id="flip">Log in</button>';
 $('#flip').onclick=()=>{mode=login?'signup':'login';step=1;bad();render();$('#email').focus()};
 document.querySelectorAll('.soc span').forEach((s,i)=>s.textContent='Continue with '+['GitHub','Discord'][i]);
 if(!reset)$('#note').textContent='';
 if(step===2)(reset?$('#pw'):(login?$('#pw'):$('#name'))).focus();
}
$('#forgotWrap').onclick=e=>{if(e.target.closest('#fp')){mode='reset';step=1;bad();render();$('#email').focus()}};

$('#edit').onclick=()=>{step=1;bad();render();$('#email').focus()};
$('#eye').onclick=()=>{const p=$('#pw'),s=p.type==='password';p.type=s?'text':'password';$('#eye').innerHTML=s?eyeOff:eyeOn;$('#eye').setAttribute('aria-label',s?'Hide password':'Show password')};
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>bad()));

$('#form').addEventListener('submit',async e=>{
 e.preventDefault();
 if(busy)return;
 const email=$('#email').value.trim().toLowerCase();

 // ---- password reset ----
 if(mode==='reset'){
  if(step===1){
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return bad('fEmail','Enter a valid email address.');
   busy=true;$('#go').disabled=true;$('#go').textContent='Sending…';
   const res=await api('reset-request',{email});
   busy=false;$('#go').disabled=false;render();
   if(res.link){
    $('#note').innerHTML='<span class="reset-warn">Email delivery is not configured on this server, so your reset link is here:</span><a class="reset-link" href="'+res.link+'">Open the reset link</a>';
   }else{
    $('#note').textContent=res.delivered?'Reset link sent — check your inbox.':'If an account exists for that email, a reset link is on its way.';
   }
   return;
  }
  const pw=$('#pw').value;
  if(pw.length<8)return bad('fPw','Use at least 8 characters.');
  busy=true;$('#go').disabled=true;$('#go').textContent='Updating…';
  const res=await api('reset-complete',{token:resetToken,password:pw});
  busy=false;$('#go').disabled=false;
  if(!res.ok){render();return bad('fPw',res.error||'Could not reset your password.')}
  mode='login';step=1;resetToken='';bad();render();
  $('#note').textContent='Password updated. Sign in with your new password.';
  return;
 }

 if(step===1){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return bad('fEmail','Enter a valid email address.');
  step=2;bad();return render();
 }
 const pw=$('#pw').value;
 if(mode==='signup'&&!$('#name').value.trim())return bad('fName','Enter your name.');
 if(pw.length<8)return bad('fPw','Use at least 8 characters.');
 busy=true;$('#go').disabled=true;$('#go').textContent=mode==='signup'?'Creating account…':'Signing in…';
 const res=await api(mode==='signup'?'signup':'login',{email,password:pw,name:$('#name').value.trim()});
 busy=false;$('#go').disabled=false;
 if(!res.ok){render();return bad(mode==='signup'?'fPw':'fPw',res.error||'Something went wrong.')}
 ls.set('helios_token',res.token);
 ls.set('hn',res.name||'Helios'); // Helios reads this name for its greeting
 ls.set('helios_user',JSON.stringify({email:res.email,name:res.name}));
 $('#go').textContent='Redirecting';
 location.href=APP_URL;
});

// Replace with your OAuth redirect for each provider.
const PROVIDER_IDS=['GitHub','Discord'];
const PROVIDER_KEYS={GitHub:'github',Discord:'discord'};
let configured={};

function paintSocial(){
 document.querySelectorAll('.soc button').forEach(b=>{
  const key=PROVIDER_KEYS[b.dataset.p];
  const on=configured[key];
  const label=b.querySelector('span');
  b.style.opacity=on?'1':'.55';
  b.title=on?('Continue with '+b.dataset.p):(b.dataset.p+' sign-in needs a client ID on the server');
  b.onclick=()=>{
   if(on){label.textContent='Redirecting…';location.href='/api/auth?action=oauth-start&provider='+key;return}
   const P=key==='github'?'GITHUB':'DISCORD';
   $('#note').textContent=b.dataset.p+' sign-in isn’t connected yet — add '+P+'_CLIENT_ID and '+P+'_CLIENT_SECRET to the server.';
  };
 });
}
paintSocial();

// Which providers does the server have credentials for?
api('providers',{}).then(d=>{
 if(d&&d.providers)configured=d.providers;
 paintSocial();
}).catch(()=>paintSocial());

// Show an error that came back from a failed OAuth callback.
(function(){
 const err=new URLSearchParams(location.search).get('error');
 if(err){$('#note').textContent=decodeURIComponent(err).replace(/-/g,' ');}})();

// Opened from a password reset link?  Jump straight to "choose a new password".
(function(){
 const t=new URLSearchParams(location.search).get('reset');
 if(!t)return;
 resetToken=t;mode='reset';step=2;
 api('reset-verify',{token:t}).then(d=>{
  if(d&&d.ok){$('#email').value=d.email;render();$('#pw').focus()}
  else{mode='login';step=1;resetToken='';render();$('#note').textContent=d&&d.error||'That reset link is invalid or has expired.';}
 }).catch(()=>{mode='login';step=1;resetToken='';render()});
})();

render();

// Already signed in? Skip straight to the app.
if(ls.get('helios_token')){
 api('session',{token:ls.get('helios_token')}).then(d=>{if(d&&d.ok)location.replace(APP_URL);else ls.set('helios_token',null)}).catch(()=>{});
}
</script>
</body></html>
