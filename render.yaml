services:
  - type: web
    name: helios-api
    runtime: node
    plan: free
    buildCommand: "echo 'no build step'"
    startCommand: "node server/index.js"
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_KEYS
        sync: false
      - key: UNOROUTER_KEYS
        sync: false
      - key: OPENROUTER_KEYS
        sync: false
      - key: AGNES_KEYS
        sync: false
      - key: DB_TOKEN
        sync: false
      - key: DB_REPO
        sync: false
      - key: DB_PATH
        sync: false
      - key: AUTH_SECRET
        generateValue: true
