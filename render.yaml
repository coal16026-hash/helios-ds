services:
  - type: web
    name: helios-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: "echo 'zero-dep node proxy; no build'"
    startCommand: "node --env-file-if-exists=.env index.js"
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_KEYS
        sync: false
      - key: UNOROUTER_KEYS
        sync: false
      - key: OPENROUTER_KEYS
        sync: false
      - key: AGNES_KEYS
        sync: false
